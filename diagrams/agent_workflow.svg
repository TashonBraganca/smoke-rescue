<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a6"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1d2433" text-anchor="start" font-weight="700">Smoke Rescue: one agent step (OpenCV results change the next action)</text><text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6475" text-anchor="start" font-weight="400">Every arrow is logged in agent_trace.jsonl and the robot’s decisions.jsonl. The model only sees this robot’s own data.</text><rect x="24" y="100" width="320" height="96" rx="6" fill="#ffffff" stroke="#5f9a52" stroke-width="1.2"/><text x="34" y="119" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">1  Brain event</text><text x="34" y="137" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">survivor_candidate, no_frontier, area_searched,</text><text x="34" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">escape_closing, agent_goal_reached, or 20 s</text><rect x="368" y="100" width="320" height="96" rx="6" fill="#ffffff" stroke="#5b8cc9" stroke-width="1.2"/><text x="378" y="119" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">2  Context</text><text x="378" y="137" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">Recorder flushes frames and logs; sends own pose,</text><text x="378" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">offered frontiers, LiDAR sectors, radio inbox</text><rect x="712" y="100" width="320" height="96" rx="6" fill="#ffffff" stroke="#c98a3e" stroke-width="1.2"/><text x="722" y="119" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">3  Perceive (OpenCV 5)</text><text x="722" y="137" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">inspect_candidate, scan_thermal, YOLO11m,</text><text x="722" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">check_indoors on the robot’s own frame</text><rect x="1056" y="100" width="320" height="96" rx="6" fill="#ffffff" stroke="#c98a3e" stroke-width="1.2"/><text x="1066" y="119" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">4  Decide (GPT)</text><text x="1066" y="137" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">Reads tool results with their evidence ids,</text><text x="1066" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">chooses an action that cites one</text><rect x="24" y="270" width="320" height="96" rx="6" fill="#ffffff" stroke="#c98a3e" stroke-width="1.2"/><text x="34" y="289" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">5  Guardrail (Python)</text><text x="34" y="307" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">Evidence type and position match, confirm</text><text x="34" y="323" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">within 4 m, not a person already carried out</text><rect x="368" y="270" width="320" height="96" rx="6" fill="#ffffff" stroke="#5f9a52" stroke-width="1.2"/><text x="378" y="289" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">6  Brain check (C#)</text><text x="378" y="307" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">Indoors by its own evidence? Heat building</text><text x="378" y="323" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">with no frontier left? Already leaving?</text><rect x="712" y="270" width="320" height="96" rx="6" fill="#ffffff" stroke="#5b8cc9" stroke-width="1.2"/><text x="722" y="289" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">7  Act</text><text x="722" y="307" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">go_to / explore_frontier / confirm / reject,</text><text x="722" y="323" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">torch, keep-out area, door, water, lift</text><rect x="1056" y="270" width="320" height="96" rx="6" fill="#ffffff" stroke="#c98a3e" stroke-width="1.2"/><text x="1066" y="289" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="700">8  Talk</text><text x="1066" y="307" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">send_team_message over the lossy radio;</text><text x="1066" y="323" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">commander relays, approves risky actions</text><path d="M 344 148 L 368 148" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 344 318 L 368 318" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 688 148 L 712 148" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 688 318 L 712 318" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 1032 148 L 1056 148" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 1032 318 L 1056 318" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 1216 196 L 1216 230 L 184 230 L 184 270" fill="none" stroke="#8a93a6" stroke-width="1.6" marker-end="url(#head)"/><path d="M 528 366 L 528 400" fill="none" stroke="#8a93a6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="538" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">refused: the reason goes back to the model in the same step</text><path d="M 872 366 L 872 400" fill="none" stroke="#8a93a6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="882" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">refused by the brain: logged, the agent is told at its next step</text><rect x="24" y="470" width="1352" height="260" rx="10" fill="#f3f0f8" stroke="#8a72b5" stroke-width="1.5"/><text x="36" y="492" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a72b5" text-anchor="start" font-weight="700">Observed in the held-out run (seed 914, robot B); evidence ids from agent_trace.jsonl</text><text x="40" y="506" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="400">0.0 s   inspect_candidate (4.8 m) -&gt; uncertain [b63fd941] -&gt; approach_candidate citing it -&gt; brain go_to, facing the shape.</text><text x="40" y="532" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="400">4.0 s   brain: survivor_candidate (thermal blob) -&gt; inspect_candidate (3.6 m) -&gt; person [2d4da82a] -&gt; confirm_survivor citing it: accepted</text><text x="40" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6475" text-anchor="start" font-weight="400">          (truth: person s1, 0.14 m from the confirmed position).</text><text x="40" y="584" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="400">13.2 s  extract_survivor citing [2d4da82a] -&gt; arm grips, sled -&gt; towed out; set down past the front door at 47.0 s; re-entered at 48.4 s.</text><text x="40" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="400">18.8 s  brain: avoid_fire -&gt; track_fire_spread [c4627820] -&gt; avoid_area citing it + team message: fire growing ahead of its route out.</text><text x="40" y="636" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d2433" text-anchor="start" font-weight="400">43.7 s  explore_frontier while still towing -&gt; refused by the brain: "the robot is leaving (Carrying a person out.)".</text><text x="40" y="662" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6475" text-anchor="start" font-weight="400">Every action cites the OpenCV result it depends on; the same calls without a matching result are refused in code (tests).</text></svg>
