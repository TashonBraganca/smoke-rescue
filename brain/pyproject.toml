[project]
name = "brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tashon Braganca", email = "tashon.braganca.ai@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "evo>=1.38.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=2.3",
    "mlx-vlm>=0.7.9",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
    "rerun-sdk>=0.39.0",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.182",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
