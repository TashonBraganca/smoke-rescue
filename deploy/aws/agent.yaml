AWSTemplateFormatVersion: "2010-09-09"
Description: Smoke Rescue agent service. VPC without NAT, ECR, ECS Fargate on Graviton behind an ALB, least-privilege task role.

Parameters:
  ProjectName:
    Type: String
    Default: smoke-rescue
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
  RunsBucketName:
    Type: String
    Description: Name of the runs bucket created by storage.yaml. Only its agent/ prefix is granted.
  ImageTag:
    Type: String
    Default: bootstrap
    Description: Tag of the agent image in the ECR repository.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: One task owns the in-memory maps, place databases and approvals. Keep 0 until the first image is pushed. deploy.sh sets it to 1 afterwards.
  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096", "8192"]
  AgentBackend:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, azure]
    Description: Bedrock uses the ECS task role and needs no API key.
  AzureSecretArn:
    Type: String
    Default: ""
    Description: Existing Secrets Manager ARN with AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY and AZURE_OPENAI_API_VERSION JSON keys. Required for azure.
  AgentModelId:
    Type: String
    Description: Value of AGENT_MODEL. For Mumbai use in.anthropic.claude-haiku-4-5-20251001-v1:0; for us-east-1 use us.anthropic.claude-haiku-4-5-20251001-v1:0. Azure uses its deployment name.
  BedrockModelArns:
    Type: CommaDelimitedList
    Description: Exact model and inference profile ARNs the task may invoke. Nothing else is granted.
  CloudFrontPrefixListId:
    Type: String
    Default: ""
    Description: com.amazonaws.global.cloudfront.origin-facing prefix list id. Empty opens port 80 to the internet and relies on the origin secret.
  OriginSecretName:
    Type: String
    Default: smoke-rescue/origin-verify
    Description: Secrets Manager name created here. CloudFront sends it in X-Origin-Verify and the ALB rejects requests without it.
  EnableWaf:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  RateLimitPer5Min:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Requests per 5 minutes per source IP (a CloudFront edge address) before the ALB blocks.

Rules:
  AzureRequiresSecret:
    RuleCondition: !Equals [!Ref AgentBackend, azure]
    Assertions:
      - Assert: !Not [!Equals [!Ref AzureSecretArn, ""]]
        AssertDescription: Azure needs an existing Secrets Manager ARN.

Conditions:
  UseAzure: !Equals [!Ref AgentBackend, azure]
  UsePrefixList: !Not [!Equals [!Ref CloudFrontPrefixListId, ""]]
  NoPrefixList: !Equals [!Ref CloudFrontPrefixListId, ""]
  WafOn: !Equals [!Ref EnableWaf, "true"]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-a" }]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PublicRouteTable

  # Free gateway endpoint: S3 traffic from tasks and Batch jobs stays on the AWS network.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: [!Ref PublicRouteTable]

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/vpc-flow-rejects"
      RetentionInDays: 14

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${FlowLogGroup.Arn}:*"

  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # ---------------------------------------------------------------- security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB, reachable from CloudFront only
      VpcId: !Ref Vpc

  AlbIngressFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UsePrefixList
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontPrefixListId
      Description: CloudFront origin-facing addresses

  AlbIngressOpen:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: NoPrefixList
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Open because no prefix list was given. The ALB still requires the origin secret header.

  AlbEgressToTasks:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref TaskSecurityGroup
      Description: Agent containers

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Agent tasks, ingress from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Bedrock, S3, ECR, CloudWatch over HTTPS

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: From the ALB

  # ---------------------------------------------------------------- registry and logs
  AgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}/agent"
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-agent"
      RetentionInDays: 14

  # ---------------------------------------------------------------- secrets and roles
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref OriginSecretName
      Description: Shared value CloudFront sends in X-Origin-Verify so only CloudFront can use the ALB.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: pull-image-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt AgentRepository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${AgentLogGroup.Arn}:*"

              - !If
                - UseAzure
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref AzureSecretArn
                - !Ref AWS::NoValue

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: agent-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The agent sees only agent/. recordings/ (with oracle ground truth) and runs/ are out of reach.
              - Sid: AgentPrefixObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${RunsBucketName}/agent/*"
              - Sid: AgentPrefixList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${RunsBucketName}"
                Condition:
                  StringLike: { "s3:prefix": ["agent/*"] }
              # bedrock:InvokeModel also authorises the Converse API (AWS Bedrock user guide, inference-prereq).
              - Sid: InvokeConfiguredModelOnly
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArns
              - Sid: PublishOwnMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": SmokeRescue }

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-agent"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: tmp
      ContainerDefinitions:
        - Name: agent
          Image: !Sub "${AgentRepository.RepositoryUri}:${ImageTag}"
          Essential: true
          User: "10001"
          ReadonlyRootFilesystem: true
          Privileged: false
          StopTimeout: 30
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - ContainerPath: /tmp
              SourceVolume: tmp
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities:
              Drop: [ALL]
          Environment:
            - { Name: AGENT_BACKEND, Value: !Ref AgentBackend }
            - { Name: AGENT_MODEL, Value: !Ref AgentModelId }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: RUNS_BUCKET, Value: !Ref RunsBucketName }
            - { Name: RUNS_PREFIX, Value: agent/ }
            - { Name: METRICS_NAMESPACE, Value: SmokeRescue }
            # AWS calls use shorter per-call bounds so the proxy can return a whole step.
            - { Name: AZURE_OPENAI_TIMEOUT_S, Value: "15" }
            - { Name: AZURE_OPENAI_MAX_ATTEMPTS, Value: "1" }
          Secrets: !If
            - UseAzure
            - - Name: AZURE_OPENAI_ENDPOINT
                ValueFrom: !Sub "${AzureSecretArn}:AZURE_OPENAI_ENDPOINT::"
              - Name: AZURE_OPENAI_API_KEY
                ValueFrom: !Sub "${AzureSecretArn}:AZURE_OPENAI_API_KEY::"
              - Name: AZURE_OPENAI_API_VERSION
                ValueFrom: !Sub "${AzureSecretArn}:AZURE_OPENAI_API_VERSION::"
            - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD
              - python
              - -c
              - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AgentLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: agent

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "150" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: deletion_protection.enabled, Value: "false" }
    DependsOn: GatewayAttachment

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: forbidden

  ForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: OriginVerifySecret
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub "{{resolve:secretsmanager:${OriginSecretName}:SecretString}}"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ForwardRule
    Properties:
      ServiceName: !Sub "${ProjectName}-agent"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: agent
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- abuse limit (protects the Bedrock bill)
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafOn
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-alb"
      Rules:
        - Name: rate-limit-per-ip
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-rate-limit"

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafOn
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

Outputs:
  VpcId: { Value: !Ref Vpc }
  SubnetIds: { Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]] }
  AlbDnsName: { Value: !GetAtt LoadBalancer.DNSName }
  AlbSecurityGroupId: { Value: !Ref AlbSecurityGroup }
  AlbFullName: { Value: !GetAtt LoadBalancer.LoadBalancerFullName }
  TargetGroupFullName: { Value: !GetAtt TargetGroup.TargetGroupFullName }
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
  AgentRepositoryUri: { Value: !GetAtt AgentRepository.RepositoryUri }
  AgentLogGroup: { Value: !Ref AgentLogGroup }
  TaskRoleArn: { Value: !GetAtt TaskRole.Arn }
