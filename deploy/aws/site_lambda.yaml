AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Smoke Rescue judge site over HTTPS while CloudFront awaits account verification. A Lambda Function URL (arm64,
  Graviton) serves the static site from a private S3 bucket and proxies only the public read-only OpenCV routes
  (/api/health, /api/vision/*, /api/perceive/people) to the agent ALB. No origin header is attached, so model routes
  stay closed (the ALB answers 403 without it). /api/mission* is the "Run your own rescue" API
  (tools/ryor/CONTRACT.txt; resources in stack smoke-rescue-ryor). Deploy with deploy/aws/deploy_site_lambda.sh.

Parameters:
  RyorFamily:
    Type: String
    Default: smoke-rescue-ryor
    Description: Immutable task definition revision paired with RyorEngine, so a deployment cannot mix engine versions.
  AlbUrl:
    Type: String
    Default: http://smoke--LoadB-m7oFRuQ63UoE-1386562850.us-east-1.elb.amazonaws.com
    Description: Agent service ALB (stack smoke-rescue-agent, listener rule PublicOpenCvRule).
  ReservedConcurrency:
    Type: String
    Default: ""
    Description: >-
      Reserved concurrency cap. Empty by default because this account's Lambda limit is 10 concurrent executions,
      and Lambda refuses any reservation that leaves fewer than 10 unreserved; that account limit of 10 is the cap
      until a quota increase. Set e.g. 5 after the quota is raised.

  CodeBucket:
    Type: String
    Description: Bucket holding the function zip (deploy_site_lambda.sh uploads it to the ryor runs bucket, deploy/).
  CodeKey:
    Type: String
    Description: Content-addressed key of the function zip.
  RyorPolicyArn:
    Type: String
    Default: ""
    Description: Stack smoke-rescue-ryor output LambdaPolicyArn. Empty turns the mission API and its schedule off.
  RyorBucket: { Type: String, Default: "" }
  RyorTable: { Type: String, Default: "" }
  RyorCluster: { Type: String, Default: smoke-rescue }
  RyorSubnets: { Type: String, Default: "subnet-0cc6300638b000910,subnet-0dc74c2f3b81a8eb6" }
  RyorSecurityGroup: { Type: String, Default: "" }
  RyorEngine: { Type: String, Default: "", Description: Image label reported by /api/mission/health. }
  RyorEnabled:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: Kill switch. "0" answers every POST /api/mission with the recorded fallback (reason "disabled").
  RyorDailyCap:
    Type: Number
    Default: 150
    MinValue: 0
    Description: Live missions started per UTC day, site-wide; beyond it POST answers the recorded fallback ("busy").
  RyorCap:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10
    Description: Most ryor Fargate tasks running at once (ecs ListTasks on family smoke-rescue-ryor; the precompute family is separate).
  RyorIpLimit:
    Type: Number
    Default: 6
    MinValue: 0
    Description: Mission requests per source IP per clock hour before the recorded fallback (reason "rate_limited").
  RyorHardLimitS:
    Type: Number
    Default: 600
    Description: Wall seconds after which the API stops a ryor task and fails its mission.

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, ""]]
  HasRyor: !Not [!Equals [!Ref RyorPolicyArn, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags: [{ Key: Project, Value: smoke-rescue }]

  SiteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/smoke-rescue-site
      RetentionInDays: 14

  SiteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: !If [HasRyor, [!Ref RyorPolicyArn], !Ref "AWS::NoValue"]
      Policies:
        - PolicyName: site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SiteLogs.Arn

  SiteFunction:
    Type: AWS::Lambda::Function
    DependsOn: SiteLogs
    Properties:
      FunctionName: smoke-rescue-site
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 70
      Role: !GetAtt SiteRole.Arn
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig: { LogGroup: !Ref SiteLogs, LogFormat: Text }
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          ALB: !Ref AlbUrl
          RYOR_BUCKET: !Ref RyorBucket
          RYOR_TABLE: !Ref RyorTable
          RYOR_CLUSTER: !Ref RyorCluster
          RYOR_FAMILY: !Ref RyorFamily
          RYOR_SUBNETS: !Ref RyorSubnets
          RYOR_SG: !Ref RyorSecurityGroup
          RYOR_ENGINE: !Ref RyorEngine
          RYOR_ENABLED: !If [HasRyor, !Ref RyorEnabled, "0"]
          RYOR_CAP: !Ref RyorCap
          RYOR_IP_LIMIT: !Ref RyorIpLimit
          RYOR_HARD_S: !Ref RyorHardLimitS
          RYOR_DAILY_CAP: !Ref RyorDailyCap
      Tags: [{ Key: Project, Value: smoke-rescue }]
      # Source: deploy/aws/site_lambda/ (index.py + ryor_api.py), zipped and uploaded by deploy_site_lambda.sh.
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }

  # One-minute backstop bounds abandoned task cost independently of browser polling.
  SweepRule:
    Type: AWS::Events::Rule
    Condition: HasRyor
    Properties:
      Description: smoke-rescue ryor hard-limit sweep
      ScheduleExpression: rate(1 minute)
      Targets: [{ Arn: !GetAtt SiteFunction.Arn, Id: sweep, Input: '{"ryor": "sweep"}' }]

  SweepPermission:
    Type: AWS::Lambda::Permission
    Condition: HasRyor
    Properties:
      FunctionName: !Ref SiteFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepRule.Arn

  SiteUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SiteFunction
      AuthType: NONE
      # The judge site on Amplify calls the public OpenCV routes from the browser (25 Oct).
      Cors:
        AllowOrigins: ["https://main.dyhvyjxo1bz4g.amplifyapp.com", "http://localhost:3123"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 600

  SiteUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SiteFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  SiteInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SiteFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  SiteUrl:
    Value: !GetAtt SiteUrl.FunctionUrl
  SiteBucketName:
    Value: !Ref SiteBucket
