AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Smoke Rescue judge site over HTTPS while CloudFront awaits account verification. A Lambda Function URL (arm64,
  Graviton) serves the static site from a private S3 bucket and proxies only the public read-only OpenCV routes
  (/api/health, /api/vision/*, /api/perceive/people) to the agent ALB. No origin header is attached, so model routes
  stay closed (the ALB answers 403 without it). Deploy with deploy/aws/deploy_site_lambda.sh.

Parameters:
  AlbUrl:
    Type: String
    Default: http://smoke--LoadB-m7oFRuQ63UoE-1386562850.us-east-1.elb.amazonaws.com
    Description: Agent service ALB (stack smoke-rescue-agent, listener rule PublicOpenCvRule).
  ReservedConcurrency:
    Type: String
    Default: ""
    Description: >-
      Reserved concurrency cap. Empty by default because this account's Lambda limit is 10 concurrent executions,
      and Lambda refuses any reservation that leaves fewer than 10 unreserved; that account limit of 10 is the cap
      until a quota increase. Set e.g. 5 after the quota is raised.

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags: [{ Key: Project, Value: smoke-rescue }]

  SiteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/smoke-rescue-site
      RetentionInDays: 14

  SiteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SiteLogs.Arn

  SiteFunction:
    Type: AWS::Lambda::Function
    DependsOn: SiteLogs
    Properties:
      FunctionName: smoke-rescue-site
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 70
      Role: !GetAtt SiteRole.Arn
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig: { LogGroup: !Ref SiteLogs, LogFormat: Text }
      Environment:
        Variables: { BUCKET: !Ref SiteBucket, ALB: !Ref AlbUrl }
      Tags: [{ Key: Project, Value: smoke-rescue }]
      Code:
        ZipFile: |
          # Static files from S3 (files over 5 MB redirect to a 1 h presigned HTTPS URL: Lambda responses cap at 6 MB),
          # and three public OpenCV routes proxied to the ALB. Nothing else reaches the agent service.
          import base64, mimetypes, os, re, urllib.request, urllib.error
          import boto3
          s3 = boto3.client('s3')
          B, ALB = os.environ['BUCKET'], os.environ['ALB'].rstrip('/')
          API = {('GET', '/api/health'), ('POST', '/api/perceive/people')}
          VISION = re.compile(r'/api/vision/[a-z_]{1,40}\Z')
          SEC = {'X-Content-Type-Options': 'nosniff', 'Referrer-Policy': 'no-referrer'}
          def out(code, body=b'', ctype='text/plain', extra=None):
              h = {'Content-Type': ctype, **SEC, **(extra or {})}
              return {'statusCode': code, 'headers': h, 'isBase64Encoded': True, 'body': base64.b64encode(body).decode()}
          def handler(event, context):
              method = event['requestContext']['http']['method']
              path = event.get('rawPath') or '/'
              if path.startswith('/api/'):
                  if (method, path) not in API and not (method == 'POST' and VISION.match(path)):
                      return out(404, b'not a public route')
                  body = event.get('body') or ''
                  body = base64.b64decode(body) if event.get('isBase64Encoded') else body.encode()
                  hdr = {k: v for k, v in event.get('headers', {}).items() if k.lower() == 'content-type'}
                  req = urllib.request.Request(ALB + path[4:], data=body if method == 'POST' else None, method=method, headers=hdr)
                  try:
                      with urllib.request.urlopen(req, timeout=65) as r:
                          return out(r.status, r.read(), r.headers.get('Content-Type', 'application/json'))
                  except urllib.error.HTTPError as e:
                      return out(e.code, e.read(), e.headers.get('Content-Type', 'application/json'))
                  except Exception as e:
                      print('ALB error', type(e).__name__, e)
                      return out(502, b'{"detail": "OpenCV service unreachable"}', 'application/json')
              if method not in ('GET', 'HEAD'):
                  return out(405, b'method not allowed')
              key = path.lstrip('/') or 'index.html'
              if key.endswith('/'):
                  key += 'index.html'
              if '..' in key.split('/') or '\\' in key:
                  return out(400, b'bad path')
              try:
                  head = s3.head_object(Bucket=B, Key=key)
              except Exception:
                  return out(404, b'not found')
              ctype = mimetypes.guess_type(key)[0] or 'application/octet-stream'
              if head['ContentLength'] > 5 * 1024 * 1024:
                  url = s3.generate_presigned_url('get_object', Params={'Bucket': B, 'Key': key}, ExpiresIn=3600)
                  return out(302, b'', extra={'Location': url, 'Cache-Control': 'no-store'})
              data = s3.get_object(Bucket=B, Key=key)['Body'].read()
              cache = 'no-store' if key.endswith('.json') or key.endswith('.jsonl') else 'public, max-age=300'
              return out(200, data if method == 'GET' else b'', ctype, {'Cache-Control': cache})

  SiteUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SiteFunction
      AuthType: NONE

  SiteUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SiteFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  SiteInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SiteFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  SiteUrl:
    Value: !GetAtt SiteUrl.FunctionUrl
  SiteBucketName:
    Value: !Ref SiteBucket
